<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg text-center w-96">
        <h1 class="text-2xl font-bold mb-4">Weather App</h1>
        <input type="text" id="cityInput" placeholder="Enter city" class="p-2 border rounded w-full">
        <button onclick="getWeather()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded">Get Weather</button>
        
        <div id="weatherResult" class="mt-4 hidden">
            <h2 id="cityName" class="text-xl font-semibold"></h2>
            <p id="temperature"></p>
            <p id="humidity"></p>
            <p id="windSpeed"></p>
        </div>
    </div>

    <script>
        async function getWeather() {
            const apiKey = "a5434dd95f59868fb4df792eb6ab4d69"; 
            const city = document.getElementById("cityInput").value;
            if (!city) return alert("Please enter a city");

            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`);
            const data = await response.json();

            if (data.cod === 200) {
                document.getElementById("cityName").textContent = `Weather in ${data.name}`;
                document.getElementById("temperature").textContent =  `Temperature: ${data.main.temp}°C`;
                document.getElementById("humidity").textContent =  `Humidity: ${data.main.humidity}%`;
                document.getElementById("windSpeed").textContent =  `Wind Speed: ${data.wind.speed} m/s`;
                document.getElementById("weatherResult").classList.remove("hidden");
            } else {
                alert("City not found. Try again.");
            }
        }
    </script>
</body>
</html>
